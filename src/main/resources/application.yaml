spring:
  application:
    name: zhiguang

  datasource:
    # ★ rewriteBatchedStatements=true：让 JDBC 批处理改写成多值 INSERT，
    #   N 行只发 1 次网络往返 —— 批量落库能生效的前提，漏了等于白做
    url: jdbc:mysql://localhost:3306/zhiguang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

  # ===== Kafka：计数事件异步生产与消费 =====
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                      # ★ 等所有 ISR 确认，保证事件不丢
      retries: 3
      properties:
        enable.idempotence: true     # ★ 生产者幂等：重试不产生重复消息
        linger.ms: 5
        batch.size: 16384
    consumer:
      group-id: counter-persist
      auto-offset-reset: earliest
      enable-auto-commit: false      # 手动 ack：处理完才提交位点
      max-poll-records: 500          # ★ 一次拉 500 条，交给批量落库
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch                    # ★ 批量监听
      ack-mode: manual

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zhiguang.user.domain

logging:
  level:
    com.zhiguang: info

auth:
  jwt:
    issuer: zhiguang
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    key-id: zhiguang-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
  password:
    bcrypt-strength: 12
    min-length: 8

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket: zhiguangccy
  public-domain:
  folder: avatars

server:
  error:
    include-message: always

counter:
  kafka:
    topic: counter-events
  reconcile:
    interval-ms: 300000          # 5 分钟一轮
    initial-delay-ms: 30000      # ★ 首次延迟，别在启动时抢资源
    tolerance: 1000              # ★ 在途容忍上限：差值小于它视为"异步落库还没追上"
  cache:
    base-ttl-seconds: 7200
    jitter-seconds: 1200

relation:
  outbox:
    topic: canal-outbox                 # Canal Kafka 模式写入的主题
    consumer-group: relation-projection # 关系缓存投影消费者组
