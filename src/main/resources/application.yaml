spring:
  application:
    name: zhiguang                     # 应用名，随意，建议项目名

  datasource:
    url: jdbc:mysql://localhost:3306/zhiguang?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # HikariCP 默认只有 10 个连接。200 并发压测暴露连接池是瓶颈，调到 50 做对照实验
      maximum-pool-size: 50

  data:              # ← 加这一层
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s   # 这一层和上面都没

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zhiguang.user.domain   # 注意这里也要改对

logging:
  level:
    # 压测时必须用 info：debug 会把每条 SQL 连同参数同步打印，
    # 400+ 条日志的开销会污染测量结果（见压测对照实验）
    com.zhiguang: info

auth:
  jwt:
    issuer: zhiguang
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    key-id: zhiguang-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem

  password:
    bcrypt-strength: 12
    min-length: 8

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket: zhiguangccy
  public-domain:
  folder: avatars

server:
  error:
    include-message: always     # 让 500 也返回 message，调试期间不至于瞎

counter:
  reconcile:
    interval-ms: 300000          # 5 分钟对账一次
