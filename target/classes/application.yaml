spring:
  application:
    name: zhiguang                     # 应用名，随意，建议项目名

  datasource:
    url: jdbc:mysql://localhost:3306/zhiguang?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:              # ← 加这一层
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s   # 这一层和上面都没

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zhiguang.user.domain   # 注意这里也要改对

logging:
  level:
    com.zhiguang: debug


auth:
  jwt:
    issuer: zhiguang
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    key-id: zhiguang-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem

  password:
    bcrypt-strength: 12
    min-length: 8